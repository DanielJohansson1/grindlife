<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grindlife</title>
<meta name="theme-color" content="#6b4527">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Grindlife">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/press-start-2p.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:'Press Start 2P';src:url(fonts/press-start-2p.woff2) format('woff2');font-display:swap}
:root{--bg:#6b4527;--panel:#f2d9a1;--field:#fff6dc;--fg:#3b2412;--mid:#6b4423;--hd:#f7e3b0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a1a0e;--panel:#cfae6f;--field:#e8d3a0;--hd:#e8c98a}}
:root[data-theme="dark"]{--bg:#2a1a0e;--panel:#cfae6f;--field:#e8d3a0;--hd:#e8c98a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg) repeating-linear-gradient(90deg,transparent 0 46px,rgba(0,0,0,.14) 46px 48px);color:var(--fg);font:10px/1.7 'Press Start 2P',ui-monospace,monospace;image-rendering:pixelated}
main{max-width:480px;margin:0 auto;padding:14px 14px 90px}
h1,h2{color:var(--hd);text-shadow:2px 2px 0 var(--fg)}
h1{font-size:14px;margin:4px 0 12px}
h2{font-size:10px;margin:18px 0 8px}
.box{border:4px solid var(--fg);background:var(--panel);padding:10px;box-shadow:inset 0 0 0 3px #e4b86a,3px 3px 0 rgba(0,0,0,.35)}
button,input,select{font:inherit;color:var(--fg);background:var(--field);border:3px solid var(--fg);padding:8px;border-radius:0}
button{cursor:pointer;box-shadow:2px 2px 0 var(--fg)}
button:active{transform:translate(2px,2px);box-shadow:none}
button:disabled{opacity:.5;cursor:default}
h1{display:flex;justify-content:space-between;align-items:center}
.cog{background:transparent;border:0;box-shadow:none;padding:2px}
.cog svg{width:30px;height:30px;fill:var(--hd);display:block}
@keyframes bob{0%,49%{transform:translateY(0)}50%,100%{transform:translateY(-1px)}}
.bob{animation:bob 1s infinite}
.noanim .bob{animation:none}
@media (prefers-reduced-motion:reduce){.bob{animation:none}}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:96px;padding:8px;border:3px solid var(--fg);background:var(--panel);box-shadow:inset 0 0 0 3px #e4b86a,2px 2px 0 var(--fg);text-align:center}
.glow{background:#ffe27a;color:var(--fg);animation:glow .9s steps(2) infinite;box-shadow:2px 2px 0 var(--fg),0 0 0 4px #f0c030}
@keyframes glow{0%{background:#ffe27a;box-shadow:2px 2px 0 var(--fg),0 0 0 4px #f0c030}50%{background:#fffbe0;box-shadow:2px 2px 0 var(--fg),0 0 0 4px #fff3a0}}
.noanim .glow{animation:none}
@media (prefers-reduced-motion:reduce){.glow{animation:none}}
.tile{position:relative}
.boss{position:relative;width:100%;display:flex;align-items:center;gap:10px;text-align:left;padding:8px;background:var(--panel);border:4px solid var(--fg);box-shadow:inset 0 0 0 3px #e4b86a,3px 3px 0 rgba(0,0,0,.35)}
.boss .bspr{width:56px;height:56px;flex:none;background:var(--field);border:2px solid var(--fg)}
.boss .bi{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
.boss .bi b{font-weight:normal;font-size:9px}
.boss small{font-size:7px;color:var(--mid);line-height:1.5}
.hpbar{display:block;height:10px;border:2px solid var(--fg);background:#5a2a22}
.hpbar i{display:block;height:100%;background:#e05a47;box-shadow:inset 0 2px 0 #ff8a7a;transition:width .4s}
.hpbar.big{width:100%;height:12px}
.hpn{font-size:9px;flex:none}
.boss.beaten .bspr{filter:grayscale(1);opacity:.6}
.boss.beaten .hpn{color:#2f7a1f}
.boss.hurt .bspr{animation:shake .4s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.dmg{position:absolute;left:30px;top:6px;color:#c23b2c;font-size:11px;text-shadow:1px 1px 0 #fff6dc;animation:gain 1.4s ease-out forwards;pointer-events:none}
.shelf{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;width:100%;padding:6px;background:#8a5a32;border:3px solid var(--fg);box-shadow:inset 0 -4px 0 #6b4423}
.tro{display:flex;flex-direction:column;align-items:center;gap:2px}
.tro .tsp{width:36px;height:36px}
.tro small{font-size:7px;color:#fff1c4}
.tro.none .tsp{filter:brightness(0) opacity(.35)}
.card .bbig{width:128px;height:128px}
.card .gone{filter:grayscale(1);opacity:.6}
.noanim .boss.hurt .bspr{animation:none}
@media (prefers-reduced-motion:reduce){.boss.hurt .bspr{animation:none}.dmg{animation:none}}
.spr{position:relative;flex:none;line-height:0}
.say{position:absolute;top:2px;left:58px;width:max-content;max-width:150px;background:#fffaf0;color:var(--fg);border:3px solid var(--fg);padding:6px 8px;font-size:8px;line-height:1.5;opacity:0;transform:translateY(4px);transition:opacity .2s,transform .2s;pointer-events:none;z-index:3;box-shadow:2px 2px 0 rgba(0,0,0,.3)}
.say.show{opacity:1;transform:none}
.say::after{content:'';position:absolute;left:10px;bottom:-9px;width:6px;height:6px;background:#fffaf0;border:3px solid var(--fg);border-top:0;border-left:0;transform:skewY(45deg)}
@media (prefers-reduced-motion:reduce){.say{transition:none}}
.tw{position:relative;display:flex}
.tw .tile{flex:1}
.ib{position:absolute;top:7px;left:7px;width:26px;height:26px;padding:0;font-size:11px;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:1px 1px 0 var(--fg);border-width:2px}
.ovl{position:fixed;inset:0;background:rgba(30,18,8,.6);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.card{width:100%;max-width:320px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.card .cpic{width:112px;height:112px;border:3px solid var(--fg);background:var(--field)}
.card h3{margin:0;font-size:12px}
.card small{font-size:8px;color:var(--mid)}
.card p{margin:0}
.card .lbl{margin-top:8px;font-size:8px;color:var(--mid)}
.card button{margin-top:12px;width:100%}
.spk{display:inline-block;width:4px;height:4px;background:#f0c030;box-shadow:4px 0 #f0c030,-4px 0 #f0c030,0 4px #f0c030,0 -4px #f0c030;margin:0 8px;animation:blink .8s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.noanim .spk{animation:none}
@media (prefers-reduced-motion:reduce){.spk{animation:none}}
.tabs{display:flex;gap:8px;margin:14px 0 10px}
.tabs button{flex:1;background:rgba(0,0,0,.25);color:var(--hd);border-color:var(--fg);box-shadow:none}
.tabs button[aria-pressed="true"]{background:var(--field);color:var(--fg);box-shadow:inset 0 0 0 3px #e4b86a,2px 2px 0 var(--fg)}
.tile svg.qth{background:var(--field)}
.tile[aria-pressed="false"] svg.qth{opacity:.45}
.tabs button{padding:8px 4px}
.tile svg.thumb{width:72px;height:72px;border:2px solid var(--fg)}
.tile svg{width:40px;height:40px}
.tile small{font-size:7px;color:var(--mid)}
.tile.locked{background:var(--bg);box-shadow:none;color:var(--hd);opacity:.7}
.tile.locked b{font-size:20px}
:focus-visible{outline:3px dashed var(--fg);outline-offset:2px}
.hero{display:flex;gap:12px;align-items:center}
svg.sprite{width:150px;height:150px;flex:none;border:3px solid var(--fg)}
.stats{flex:1;display:grid;gap:10px}
.s-STR{--c:#c0392b}.s-INT{--c:#2f6fd0}.s-CHA{--c:#d9658f}.s-DIS{--c:#3f9b3f}
.stat .row{display:flex;justify-content:space-between}
.seg{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;margin:3px 0}
.seg i{height:9px;border:2px solid var(--fg);background:var(--field)}
.seg i.on{background:var(--c)}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:15px;padding:0 2px;margin-left:5px;border:2px solid var(--fg);font-size:7px;font-weight:normal;vertical-align:middle;background:var(--field)}
.tier1 .badge{background:#d58b4a}.tier2 .badge{background:#c9d1da}.tier3 .badge,.tier4 .badge{background:#e8bf4f}
.tier4 .badge{box-shadow:0 0 0 2px #fff1a8}
.tier1 .seg i{border-color:#a0612a}.tier2 .seg i{border-color:#8f9aa6}.tier3 .seg i,.tier4 .seg i{border-color:#b8860b}
.trial{font-size:7px;line-height:1.5;color:#8a6200}
.lock{display:inline-block;width:7px;height:7px;background:#8a6200;margin-right:4px;vertical-align:baseline}
.prog{height:6px;background:var(--field);border:2px solid var(--fg)}
.prog b{display:block;height:100%;background:var(--c)}
.task{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:2px dashed var(--mid);position:relative;transition:opacity .35s}
.task.won{background:#cfe9a6;box-shadow:-8px 0 0 #cfe9a6,8px 0 0 #cfe9a6}
.task.won .chk{background:#4caf50!important;color:#fff;opacity:1}
.task.leaving{opacity:0}
.gain{position:absolute;right:46px;top:50%;font-size:10px;color:#2f7a1f;text-shadow:1px 1px 0 #fff6dc;white-space:nowrap;pointer-events:none;animation:gain 1.6s ease-out forwards}
@keyframes gain{0%{opacity:0;transform:translateY(-20%)}15%{opacity:1;transform:translateY(-60%)}75%{opacity:1;transform:translateY(-90%)}100%{opacity:0;transform:translateY(-140%)}}
.noanim .gain{animation:none;transform:translateY(-50%)}
@media (prefers-reduced-motion:reduce){.gain{animation:none;transform:translateY(-50%)}.task{transition:none}}
.task:last-child{border:0}
.task .n{flex:1;word-break:break-word}
.task small{display:block;font-size:8px;color:var(--mid)}
.trhead{width:100%;display:flex;align-items:center;gap:10px;text-align:left;color:var(--fg);background:#e8c98a;border:3px solid var(--fg);box-shadow:2px 2px 0 var(--fg);padding:8px 10px;margin:8px 0}
.task.trhead,.task.trhead:last-child{border:3px solid var(--fg)}
.trhead .arw{width:14px;height:18px;flex:none;fill:var(--fg);transition:transform .15s}
.trhead[aria-expanded="true"] .arw{transform:rotate(90deg)}
@media (prefers-reduced-motion:reduce){.trhead .arw{transition:none}}
.trsum{display:flex;align-items:center;justify-content:center;border:3px solid var(--fg);font-size:10px}
.task.sub{padding-left:12px;border-left:4px solid var(--mid)}
.chk{width:34px;height:34px;padding:0;flex:none;background:#8fcf6a}
.x{padding:4px 7px;flex:none;box-shadow:none}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--bg);border-top:4px solid var(--fg);box-shadow:inset 0 3px 0 #e4b86a;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;box-shadow:none;background:transparent;color:var(--hd);padding:14px 0}
nav button[aria-current="true"]{background:var(--panel);color:var(--fg)}
.add{display:grid;gap:8px}
.sug{display:flex;flex-wrap:wrap;gap:8px}
.sug button{font-size:8px;text-align:left}
.empty{color:var(--mid)}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--fg);color:var(--hd);padding:8px 12px;display:none;z-index:9;max-width:92%}
</style>
</head>
<body>
<div id="toast" role="status"></div>
<main id="app"></main>
<nav><button id="t-home" onclick="go('home')">HOME</button><button id="t-tasks" onclick="go('tasks')">TASKS</button></nav>
<script>
const KEY='grindlife-v1';
const NAMES={STR:'STRENGTH',INT:'INTELLECT',CHA:'CHARISMA',DIS:'DISCIPLINE'};
const SUGG=[['Stretch 15 min','STR',2],['Walk 30 min','STR',3],['Read 20 pages','INT',3],['Learn something new','INT',4],['Call a friend','CHA',3],['Plan the week','DIS',3,1]];
const COG=`<button class="cog" onclick="go('settings')" aria-label="Settings"><svg viewBox="0 0 9 9" shape-rendering="crispEdges"><rect x="2" y="2" width="5" height="5"/><rect x="4" y="0" width="1" height="2"/><rect x="4" y="7" width="1" height="2"/><rect x="0" y="4" width="2" height="1"/><rect x="7" y="4" width="2" height="1"/><rect x="1" y="1" width="1" height="1"/><rect x="7" y="1" width="1" height="1"/><rect x="1" y="7" width="1" height="1"/><rect x="7" y="7" width="1" height="1"/><rect x="3" y="3" width="3" height="3" style="fill:var(--bg)"/></svg></button>`;
const CORE=[{id:1,name:'Hit the gym',stat:'STR',pts:4},{id:1001,name:'CrossFit',stat:'STR',pts:5},{id:1002,name:'Beach Volleyball',stat:'STR',pts:5},{id:1003,name:'Running',stat:'STR',pts:7},{id:2,name:'Read 10 pages',stat:'INT',pts:3,daily:false},{id:1000,name:'Do Duolingo',stat:'INT',pts:1,daily:true},{id:1004,name:'Compliment someone',stat:'CHA',pts:2,daily:true},{id:1005,name:'Food prep',stat:'DIS',pts:5,weekly:true}];
const TRAIN=[1,1001,1002,1003];
let view='home',rc=0,wtab='gear',openTr=false,S=load();
function ensure(){S.tasks=S.tasks.filter(t=>!(t.perm&&!CORE.some(c=>c.id==t.id)));const core=CORE.map(c=>{const t=S.tasks.find(t=>t.id==c.id);return t?Object.assign(t,c,{perm:true}):{...c,perm:true}});S.tasks=[...core,...S.tasks.filter(t=>!CORE.some(c=>c.id==t.id))];S.settings=Object.assign({sound:true,anim:true},S.settings);S.owned=S.owned||{};S.equip=S.equip||{};S.fresh=S.fresh||{};S.qon=S.qon||{};S.tier=S.tier||{};S.trialWk=S.trialWk||{};checkTrials();checkUnlocks();S.next=Math.max(S.next||4,4);save()}
function load(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}
return{pts:{STR:0,INT:0,CHA:0,DIS:0},tasks:[],log:[],bonus:{},next:4}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
// each level costs more than the last: L -> L+1 needs 5+3L points
function lvl(p){let l=0,c=5;while(p>=c){p-=c;l++;c=5+3*l}return{l,cur:p,need:c}}
function wk(d){const x=new Date(d||Date.now());x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x.getFullYear()+'-'+x.getMonth()+'-'+x.getDate()}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2600)}
const TIERN=['NOVICE','ADEPT','EXPERT','MASTER','LEGEND'],ROMAN=['I','II','III','IV','V','VI','VII','VIII','IX','X'];
function tierOf(k){return (S.tier&&S.tier[k])||0}
function Lv(k){return Math.min(lvl(S.pts[k]).l,10*(tierOf(k)+1))}
function atTrial(k){return lvl(S.pts[k]).l>=10*(tierOf(k)+1)}
function trialProg(k){const o=S.trialOpen&&S.trialOpen[k],from=Math.max(o?o.at:Date.now(),Date.now()-7*864e5),L=S.log.filter(e=>e.t>from),days=f=>new Set(L.filter(f).map(e=>day(e.t))).size;
if(k==='STR')return[L.filter(e=>TRAIN.includes(e.id)).length,4,'TRAININGS'];
if(k==='INT')return[days(e=>e.id==2),5,'READING DAYS'];
if(k==='CHA')return[days(e=>e.id==1004),5,'COMPLIMENT DAYS'];
return[days(()=>true),6,'ACTIVE DAYS']}
function checkTrials(e){const up=[];S.tier=S.tier||{};S.trialOpen=S.trialOpen||{};
Object.keys(NAMES).forEach(k=>{if(!atTrial(k)){delete S.trialOpen[k];return}
const o=S.trialOpen[k];if(!o||o.tier!==tierOf(k)){S.trialOpen[k]={tier:tierOf(k),at:Date.now()};return}
const [a,b]=trialProg(k);if(a>=b){up.push(k);if(e){e.trOpen=e.trOpen||{};e.trOpen[k]=o}S.tier[k]=tierOf(k)+1;delete S.trialOpen[k];if(atTrial(k))S.trialOpen[k]={tier:tierOf(k),at:Date.now()}}});
return up}
function day(d){const x=new Date(d||Date.now());return x.getFullYear()+'-'+x.getMonth()+'-'+x.getDate()}
function doneToday(t){return (!!t.daily&&S.log.some(e=>e.id==t.id&&day(e.t)===day()))||(!!t.weekly&&S.log.some(e=>e.id==t.id&&wk(e.t)===wk()))}
const ITEMS=[
{id:'hat',slot:'head',name:'Wizard hat',how:'Reached Intellect level 6 with Discipline level 3',cond:()=>Lv('DIS')>=3&&Lv('INT')>=6,ic:'<rect x="3" y="6" width="10" height="2" fill="#6a44ad"/><rect x="5" y="3" width="6" height="3" fill="#6a44ad"/><rect x="7" y="1" width="3" height="2" fill="#6a44ad"/><rect x="5" y="5" width="6" height="1" fill="#e8bf4f"/>'},
{id:'shirt',slot:'torso',name:'Red shirt',how:'Reached Strength level 6 with Discipline level 3',cond:()=>Lv('DIS')>=3&&Lv('STR')>=6,ic:'<rect x="4" y="3" width="8" height="9" fill="#c23b2c"/><rect x="2" y="3" width="2" height="4" fill="#c23b2c"/><rect x="12" y="3" width="2" height="4" fill="#c23b2c"/><rect x="4" y="7" width="8" height="1" fill="#ec8a6c"/><rect x="7" y="3" width="2" height="1" fill="#d99b7e"/>'},
{id:'shirtless',slot:'torso',name:'Shirtless',how:'Reached Strength level 10',cond:()=>Lv('STR')>=10,ic:'<rect x="4" y="2" width="8" height="12" fill="#f3c4a2"/><rect x="1" y="2" width="3" height="7" fill="#f3c4a2"/><rect x="12" y="2" width="3" height="7" fill="#f3c4a2"/><rect x="5" y="5" width="2" height="1" fill="#d99b7e"/><rect x="9" y="5" width="2" height="1" fill="#d99b7e"/><rect x="7" y="6" width="1" height="8" fill="#d99b7e"/><rect x="5" y="8" width="6" height="1" fill="#d99b7e"/><rect x="5" y="11" width="6" height="1" fill="#d99b7e"/>'},
{id:'sweat',slot:'head',name:'Sweatband',how:'Did 4 training sessions in one week',cond:()=>{const c={};S.log.forEach(e=>{if(TRAIN.includes(e.id)){const k=wk(e.t);c[k]=(c[k]||0)+1}});return Object.values(c).some(v=>v>=4)},ic:'<rect x="2" y="6" width="12" height="3" fill="#c23b2c"/><rect x="2" y="8" width="12" height="1" fill="#8c2a1f"/><rect x="13" y="9" width="2" height="3" fill="#c23b2c"/><rect x="4" y="6" width="3" height="1" fill="#ec8a6c"/>'},
{id:'read',slot:'head',name:'Reading glasses',how:'Read 10 pages on 20 different days',cond:()=>new Set(S.log.filter(e=>e.id==2).map(e=>day(e.t))).size>=20,ic:'<rect x="1" y="5" width="6" height="5" fill="#d4a63a"/><rect x="2" y="6" width="4" height="3" fill="#cfe8f5"/><rect x="9" y="5" width="6" height="5" fill="#d4a63a"/><rect x="10" y="6" width="4" height="3" fill="#cfe8f5"/><rect x="7" y="6" width="2" height="1" fill="#d4a63a"/>'},
{id:'sun',slot:'head',name:'Sunglasses',how:'Reached Charisma level 6',cond:()=>Lv('CHA')>=6,ic:'<rect x="1" y="5" width="6" height="5" fill="#1f1a27"/><rect x="9" y="5" width="6" height="5" fill="#1f1a27"/><rect x="7" y="6" width="2" height="1" fill="#1f1a27"/><rect x="2" y="6" width="2" height="1" fill="#6d6a8a"/><rect x="10" y="6" width="2" height="1" fill="#6d6a8a"/>'},

['Spike harder!','Monsterblock!','Leg day?','One more chapter','Running is cheaper than therapy',"Let's grind",'Small steps, big gains','You showed up. That counts.'].forEach(x=>L.push(x));

if(h>=5&&h<11)L.push('Good morning!','New day, new XP');

const today=S.log.filter(e=>day(e.t)===day()).length;if(h>=17&&today)P.push('Nice work today');
const tn=S.log.filter(e=>TRAIN.includes(e.id)&&wk(e.t)===w).length;if(tn>=2)P.push(tn+' trainings this week!');
Object.keys(NAMES).forEach(k=>{if(atTrial(k)){const [a,b]=trialProg(k);P.push(k+' trial: '+Math.min(a,b)+'/'+b)}else{const r=lvl(S.pts[k]);if(r.cur/r.need>=.75)P.push(k+' almost level '+(Lv(k)+1)+'!')}});
if(S.log.some(e=>e.id==1005&&wk(e.t)===w))P.push('Food prep done!');
{const bs=boss();if(bs.won)P.push('Boss defeated!');else if(bs.dealt>0)P.push(bs.b.name+': '+bs.left+' HP left!')}

  if (id === 'gym') {

    for (let y = 2; y < 30; y += 4) R(0, y, W, 1, '#8796a8');

    R(3, 24, 8, 1, '#55596a'); [3, 6, 9].forEach(x => { R(x, 22, 2, 2, '#c23b2c'); P(x, 22, '#e06a5a'); }); // plates on shelf
    // mirror (right)

    // water bottle

      const d = Math.hypot(x - cx, y - cy);

    // string lights

    // shelf with cups and a plant

    // table and coffee
    R(33, 30, 11, 2, '#8a5a32'); R(33, 30, 11, 1, '#a8703f'); R(38, 32, 2, 9, '#6b4423'); R(36, 40, 6, 1, '#4e3020');
    R(35, 27, 3, 3, '#fffaf0'); R(35, 27, 3, 1, '#6b3f22'); P(38, 28, '#fffaf0'); P(36, 25, '#ffffff'); P(37, 24, '#ffffff');

  }

  if (id === 'dojo') {

    R(0, 4, W, 26, '#f3ead2');                         // shoji screens
    for (let x = 0; x < W; x += 7) R(x, 4, 1, 26, '#8a5a32');
    for (let y = 9; y < 30; y += 6) R(0, y, W, 1, '#b08458');
    for (let x = 0; x < W; x += 14) R(x, 4, 2, 26, '#6b4423');
    // red paper lantern (left)
    R(5, 4, 1, 2, '#3a2316'); R(3, 6, 5, 1, '#2a2020'); R(2, 7, 7, 6, '#d9452f'); R(3, 13, 5, 1, '#2a2020');
    R(2, 9, 7, 1, '#b8321f'); R(2, 11, 7, 1, '#b8321f'); P(3, 8, '#f27a5a'); P(4, 8, '#f27a5a'); P(5, 14, '#e8bf4f');
    // hanging scroll (right) with abstract brush strokes

    line(39, 15, 40, 17, '#2a2222'); R(38, 18, 3, 1, '#2a2222'); line(39, 20, 38, 23, '#2a2222'); line(40, 21, 41, 24, '#2a2222'); P(39, 25, '#c23b2c');
    R(0, 29, W, 2, '#6b4423'); R(0, 29, W, 1, '#8a5a32'); // wooden edge

    R(0, 37, W, 1, '#3d4a2e'); [0, 22].forEach(x => R(x, 31, 1, 13, '#3d4a2e')); R(43, 31, 1, 13, '#3d4a2e');
    // bonsai + training staff

    rect(body, hL, y, HW, 2, 'R'); rect(body, hL, y + 1, HW, 1, 'Q');
    put(body, hL + 2, y, 'r'); put(body, hL + 3, y, 'r');
    put(body, hR + 1, y, 'R'); put(body, hR + 2, y + 1, 'R'); put(body, hR + 2, y + 2, 'Q');
  }
  if (head === 'read' || head === 'sun') {
    const c = head === 'read' ? 'G' : 'E';
    [ex1, ex2].forEach(x => {
      if (head === 'sun') { rect(body, x - 1, ey - 1, 4, 3, 'E'); put(body, x - 1, ey - 1, 'D'); }
      else { for (let i = 0; i < 4; i++) { put(body, x - 1 + i, ey - 1, 'G'); put(body, x - 1 + i, ey + 2, 'G'); }
             [ey, ey + 1].forEach(y => { put(body, x - 1, y, 'G'); put(body, x + 2, y, 'G'); }); }
    });
    for (let x = ex1 + 3; x < ex2 - 1; x++) put(body, x, ey, c);
    put(body, ex1 - 2, ey, c); put(body, ex2 + 3, ey, c);
  }
  if (head === 'flower') {
    const y = top + 1;
    rect(body, hL + 1, y, HW - 2, 1, 'Z');
    for (let x = hL + 1, i = 0; x < hR - 1; x += 3, i++) { const c = i % 2 ? 'n' : 'P'; put(body, x, y - 1, c); put(body, x + 1, y - 1, c); put(body, x, y, c); put(body, x + 1, y, 'y'); }
  }
  const clearTop = (to) => { for (let y = top - 4; y < to; y++) for (let x = hL - 2; x <= hR + 2; x++) if (body[y] && body[y][x] && 'hHL'.includes(body[y][x])) body[y][x] = null; };
  if (head === 'nightcap') {                      // Restday Everyday loot
    clearTop(top + 1);
    rect(body, hL, top + 1, HW, 2, 'n'); rect(body, hL, top + 2, HW, 1, 'N');
    const rows = [[hL + 1, hR - 1], [hL + 2, hR], [hL + 3, hR + 1], [hL + 5, hR + 2], [hR - 2, hR + 3]];
    rows.forEach(([a, b], k) => { rect(body, a, top - k, b - a + 1, 1, 'I'); put(body, b, top - k, 'A'); });
    put(body, hR + 4, top - 3, 'I'); put(body, hR + 4, top - 2, 'A'); put(body, hR + 5, top - 1, 'A');
    rect(body, hR + 4, top, 3, 2, 'n'); put(body, hR + 6, top + 1, 'N');
    put(body, hL + 3, top - 1, 'n'); put(body, hL + 6, top - 2, 'n');
  }
  if (head === 'bloom') {                         // The Wallflower loot: flower behind the ear
    const fx = hR - 2, fy = top + 2;
    rect(body, fx - 1, fy - 1, 3, 3, 'P'); [[0, -2], [-2, 0], [2, 0], [0, 2]].forEach(([dx, dy]) => put(body, fx + dx, fy + dy, 'P'));
    put(body, fx, fy, 'y'); put(body, fx + 1, fy + 1, 'k');
    put(body, fx - 2, fy + 2, 'Z'); put(body, fx - 3, fy + 3, 'Z'); put(body, fx - 2, fy + 3, 'Z');
  }
  if (head === 'chef') {                          // Takeaway Titan loot
    clearTop(top + 1);
    rect(body, hL + 1, top, HW - 2, 2, 'n'); rect(body, hL + 1, top + 1, HW - 2, 1, 'N');
    rect(body, hL, top - 1, HW, 1, 'n'); rect(body, hL - 1, top - 4, HW + 2, 3, 'n'); rect(body, hL + 1, top - 5, HW - 2, 1, 'n');
    for (let y = top - 5; y < top; y++) put(body, hR + (y > top - 5 && y < top - 1 ? 1 : 0), y, 'N');
    put(body, CX - 3, top - 2, 'N'); put(body, CX + 2, top - 3, 'N');
  }
  if (head === 'captainhat') {                    // Captain Tomorrow loot
    clearTop(top + 1);
    rect(body, hL, top - 3, HW, 3, 'n'); rect(body, hL + 1, top - 4, HW - 2, 1, 'n'); rect(body, hR - 1, top - 4, 2, 4, 'N');
    rect(body, hL - 1, top, HW + 2, 1, 'M');
    rect(body, hL, top + 1, HW, 1, 'O'); rect(body, hL + 2, top + 2, HW - 4, 1, 'O');
    put(body, CX - 1, top - 2, 'y'); put(body, CX, top - 2, 'y'); put(body, CX - 1, top - 1, 'u'); put(body, CX, top - 1, 'u');
  }
  if (head === 'antenna') {                       // The Excuse Machine loot
    rect(body, hL, top + 1, HW, 1, 'J'); put(body, hL, top + 2, 'J'); put(body, hR, top + 2, 'J');
    for (let y = top - 6; y <= top; y++) put(body, CX - 1, y, 'J');
    rect(body, CX - 2, top - 8, 3, 2, 'R'); put(body, CX - 2, top - 8, 'r');
  }
  if (head === 'crown') {
    for (let y = top - 3; y < top; y++) for (let x = hL - 2; x <= hR + 2; x++) if (body[y] && body[y][x] && 'hHL'.includes(body[y][x])) body[y][x] = null;
    rect(body, hL + 1, top - 1, HW - 2, 2, 'y'); rect(body, hL + 1, top, HW - 2, 1, 'u');
    [hL + 1, CX - 1, hR - 2].forEach(px => { rect(body, px, top - 3, 2, 2, 'y'); put(body, px, top - 3, 'Y'); });
    put(body, CX - 1, top - 1, 'R'); put(body, CX, top - 1, 'R'); put(body, hL + 2, top - 1, 'Y');
  }

  if (pose === 'wink') { put(body, ex2 + 3, ey - 2, 'Y'); put(body, ex2 + 4, ey - 3, 'y'); put(body, ex2 + 4, ey - 1, 'y'); put(body, ex2 + 5, ey - 2, 'y'); }
  if (pose === 'flex') { put(body, hR + 2, top + 3, 'B'); put(body, hR + 2, top + 4, 'B'); put(body, hR + 3, top + 4, 'B'); }
  if (pose === 'bulb') {
    const bx = CX - 1, by = Math.max(0, top - 13);
    rect(body, bx - 1, by + 1, 4, 3, 'Y'); rect(body, bx, by, 2, 1, 'Y'); put(body, bx, by + 1, 'n'); rect(body, bx, by + 4, 2, 2, 'N');
    [[bx - 3, by + 2], [bx + 4, by + 2], [bx - 2, by - 1], [bx + 3, by - 1]].forEach(([x, y]) => put(body, x, y, 'y'));
  }

  const petStage = gear && gear.pet;
  if (petStage && PET_MAPS[petStage]) {               // golden retriever sits to the right, behind the character
    const m = PET_MAPS[petStage], pw = m[0].length, px = 43 - pw, py = FB - m.length + 1;
    m.forEach((row, j) => [...row].forEach((ch, i) => { if (ch !== '.' && !body[py + j][px + i]) body[py + j][px + i] = '#p' + ch; }));
  }
  outline(body);

  // ---- speech bubble (charisma)
  const bw = [9, 11, 13][cT], bh = [7, 8, 9][cT], bx = W - 1 - bw, by = 2;
  rect(bub, bx + 1, by, bw - 2, bh, 'n'); rect(bub, bx, by + 1, bw, bh - 2, 'n');
  rect(bub, bx + 1, by + bh - 1, bw - 2, 1, 'N');
  put(bub, bx + 1, by + bh, 'n'); put(bub, bx, by + bh + 1, 'n'); // tail
  const mx = bx + Math.floor(bw / 2), myy = by + Math.floor(bh / 2) - 1;
  if (cT === 0) { [-2, 0, 2].forEach(d => put(bub, mx + d, myy + 1, 'H')); }
  else {
    const heart = ['.k.k.', 'kkkkk', '.kkk.', '..k..'];
    heart.forEach((row, j) => [...row].forEach((c, i) => c === 'k' && put(bub, mx - 2 + i, myy - 1 + j, 'k')));
    put(bub, mx - 1, myy, 'n');
    if (cT === 2) { put(bub, bx + 2, by + 2, 'y'); put(bub, bx + bw - 3, by + bh - 3, 'y'); }
  }
  outline(bub);

  // ---- background (sky, hills, grass) and ground shadow
  const bg = grid();
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    let c = y < 14 ? '#8fcaf0' : y < 26 ? '#a9d8f5' : '#c3e5f7';
    const hill = 27 + Math.round(2 * Math.sin(x / 5));
    if (y >= hill) c = '#7fbf5e';
    if (y >= 30 + Math.round(Math.sin(x / 3 + 1))) c = '#5c9e45';
    if (y >= 33) c = '#6cb34f';
    if (y >= 33 && (x * 7 + y * 3) % 11 === 0) c = '#579a3e';
    if (y >= 34 && (x * 5 + y * 9) % 17 === 0) c = '#8cd068';
    bg[y][x] = c;
  }
  [[4, 6], [5, 6], [6, 6], [5, 5], [6, 5], [7, 6], [36, 12], [37, 12], [38, 12], [37, 11]].forEach(([x, y]) => bg[y][x] = '#ffffff');
  [[3, 37], [40, 35], [7, 42], [35, 41]].forEach(([x, y]) => { bg[y][x] = '#f4e46a'; });
  [[13, 36], [31, 38]].forEach(([x, y]) => { bg[y][x] = '#f29bb0'; });
  const sh = grid();
  const sw = LW * 2 + 6;
  rect(sh, CX - sw / 2, FB + 1, sw, 1, 'z'); rect(sh, CX - sw / 2 + 2, FB + 2, sw - 4, 1, 'z');

  const col = G => G.map(r => r.map(k => k ? (k.startsWith('#p') ? PET_COLORS[k[2]] : k[0] === '#' ? k : k === 'z' ? 'rgba(30,60,20,.35)' : C[k]) : null));
  const off = { jump: [0, -3], shuffleL: [-2, 0], shuffleR: [2, 0], breath: [0, -1] }[pose] || [0, 0];
  return { W, H, dx: off[0], dy: off[1], layers: { bg: col(bg), shadow: col(sh), body: col(body), bubble: col(bub) } };
}


function runs(G){let o='';G.forEach((row,y)=>{let x=0;while(x<row.length){const c=row[x];if(!c){x++;continue}let e=x;while(e+1<row.length&&row[e+1]===c)e++;o+=`<rect x="${x}" y="${y}" width="${e-x+1}" height="1" fill="${c}"/>`;x=e+1}});return o}
function sprite(pose){
const g=gear(),d=charLayers(Lv('STR'),Lv('INT'),Lv('CHA'),g,pose);
if(S.place&&S.place!=='meadow'&&S.owned[S.place])d.layers.bg=placeBg(S.place);
return`<svg class="sprite" viewBox="0 0 ${d.W} ${d.H}" shape-rendering="crispEdges" role="img" aria-label="Your character">${runs(d.layers.bg)}${runs(d.layers.shadow)}<g transform="translate(${d.dx||0} ${d.dy||0})"><g class="${pose?'':'bob'}">${runs(d.layers.body)}</g></g>${runs(d.layers.bubble)}</svg>`}
function home(){
const stats=Object.keys(NAMES).map(k=>{const raw=lvl(S.pts[k]),T=tierOf(k),L=Lv(k),f=L-10*T,tr=atTrial(k),pr=trialProg(k);
return`<div class="stat s-${k} tier${Math.min(T,4)}"><div class="row"><span>${NAMES[k].slice(0,3)}<b class="badge">${ROMAN[Math.min(T,9)]}</b></span><span>LV${L}</span></div>
<div class="seg">${Array.from({length:10},(_,i)=>`<i class="${i<f?'on':''}"></i>`).join('')}</div>
${tr?`<div class="trial"><span class="lock"></span>TRIAL ${Math.min(pr[0],pr[1])}/${pr[1]} ${pr[2]}</div>`:`<div class="prog"><b style="width:${Math.round(raw.cur/raw.need*100)}%"></b></div>`}</div>`}).join('');
const w=wk(),tn=S.log.filter(e=>TRAIN.includes(e.id)&&wk(e.t)===w).length,q=tn>=4?3:tn>=3?2:tn>=1?1:0;
const readToday=S.log.some(e=>e.id==2&&day(e.t)===day()),fin=t=>doneToday(t)||(t.id==2&&readToday);
const row=t=>{const n=S.log.filter(e=>e.id==t.id&&wk(e.t)===w).length,dn=doneToday(t),f=fin(t),tr=TRAIN.includes(t.id);
return`<div class="task${tr?' sub':''}" style="${f?'opacity:.55':''}"><div class="n">${esc(t.name)}<small${tr&&q?' style="color:'+['','#2f7a1f','#1f5fa8','#8a6200'][q]+'"':''}>+${t.pts} ${t.stat} · ${t.once?'one-time':t.weekly?(dn?'weekly · done this week':'weekly'):t.daily?(dn?'daily · done today':'daily'):(t.id==2&&f?'goal done · extra counts':n+'x this week')}</small></div><button class="chk" ${tr?'style="background:'+['#d9c9a3','#8fcf6a','#4fb0e0','#f0c030'][q]+'"':''} ${dn?'disabled':''} onclick="done(${t.id})" aria-label="Complete ${esc(t.name)}">✔</button></div>`};
const open=S.tasks.filter(t=>!t.done),isTr=t=>TRAIN.includes(t.id);
const top=open.filter(t=>(t.daily||t.weekly||t.id==2)&&!fin(t));const rk=t=>t.id==2?2:t.perm?(t.weekly?1:0):3;top.sort((a,b)=>rk(a)-rk(b));
const own=open.filter(t=>!t.perm&&!t.daily&&!t.weekly);
const trs=open.filter(isTr);
const bottom=open.filter(t=>(t.daily||t.weekly||t.id==2)&&fin(t));
const trHead=trs.length?`<button class="task trhead" onclick="openTr=!openTr;render()" aria-expanded="${openTr}"><svg class="arw" viewBox="0 0 6 8" shape-rendering="crispEdges" aria-hidden="true"><rect x="0" y="0" width="2" height="8"/><rect x="2" y="1" width="2" height="6"/><rect x="4" y="3" width="2" height="2"/></svg><div class="n">TRAINING<small${q?' style="color:'+['','#2f7a1f','#1f5fa8','#8a6200'][q]+'"':''}>${tn}x this week · tap to ${openTr?'close':'open'}</small></div><span class="chk trsum" style="background:${['#d9c9a3','#8fcf6a','#4fb0e0','#f0c030'][q]}">${tn}</span></button>${openTr?trs.map(row).join(''):''}`:'';
const tl=(top.map(row).join('')+own.map(row).join('')+trHead+bottom.map(row).join(''))||'<p class="empty">No open quests. Add one in TASKS.</p>';
return`<h1>GRINDLIFE${COG}</h1><div class="box hero"><div class="spr">${sprite()}<div id="say" class="say" aria-live="polite"></div></div><div class="stats">${stats}</div></div>
<p>${Object.keys(S.fresh).length?'<button id="wbtn" class="glow" onclick="go(\'wardrobe\')"><i class="spk"></i>WARDROBE<i class="spk"></i></button>':'<button id="wbtn" onclick="go(\'wardrobe\')">WARDROBE</button>'}</p><h2>QUESTS</h2><div class="box">${tl}</div>
<h2>WEEKLY BOSS</h2>${bossStrip()}
<p><button onclick="undo()" ${S.log.length?'':'disabled'}>UNDO LAST</button></p>${bossCard()}`}
function tasks(){
const list=S.tasks.map(t=>`<div class="task" style="${t.done?'opacity:.6':''}"><div class="n">${esc(t.name)}<small>+${t.pts} ${NAMES[t.stat]} · ${t.once?(t.done?'done':'one-time'):t.weekly?'weekly':t.daily?'daily':'repeatable'}</small></div>${t.perm?'<small>CORE</small>':`<button class="x" onclick="del(${t.id})" aria-label="Delete ${esc(t.name)}">X</button>`}</div>`).join('')||'<p class="empty">Nothing here yet.</p>';
return`<h1>TASKS${COG}</h1><div class="box add">
<input id="nm" placeholder="New task" maxlength="40" aria-label="Task name">
<select id="st" aria-label="Stat">${Object.keys(NAMES).map(k=>`<option value="${k}">${NAMES[k]}</option>`).join('')}</select>
<select id="rp" aria-label="Task type"><option value="0">REPEATABLE</option><option value="1">ONE-TIME</option><option value="2">DAILY</option><option value="3">WEEKLY</option></select>
<input id="pt" type="number" min="1" max="20" value="3" aria-label="Points">
<button onclick="addTask(nm.value,st.value,pt.value,+rp.value)">ADD TASK</button></div>
<h2>YOUR TASKS</h2><div class="box">${list}</div>
<h2>IDEAS</h2><div class="sug">${SUGG.map((s,i)=>`<button onclick="addTask('${s[0]}','${s[1]}',${s[2]},${s[3]||0})">${s[0]}</button>`).join('')}</div>`}
function render(){
document.getElementById('app').innerHTML=view==='home'?home():view==='tasks'?tasks():view==='help'?help():view==='wardrobe'?wardrobe():settings();
document.body.classList.toggle('noanim',!S.settings.anim);
['home','tasks'].forEach(v=>document.getElementById('t-'+v).setAttribute('aria-current',v===view))}
ensure();render();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
</script>
</body>
</html>
